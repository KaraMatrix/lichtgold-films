# Pages CMS Konfiguration — https://pagescms.org
# Definiert, welche Inhalte der Kunde über die CMS-Oberfläche bearbeiten kann.

media: assets/uploads

content:
  # --- Website-Einstellungen: Firma/Kontakt (_data/settings.yml) ---
  - name: settings
    label: "Website-Einstellungen"
    type: file
    path: _data/settings.yml
    fields:
      - name: firma
        label: "Firma"
        type: object
        fields:
          - name: name
            label: "Firmenname"
            type: string
            required: true
          - name: slogan
            label: "Slogan"
            type: string
          - name: ansprechpartner
            label: "Ansprechpartner (Vor- und Nachname, optional)"
            type: string
            required: false
          - name: telefon
            label: "Telefon (optional)"
            type: string
            required: false
            description: "Leer lassen, wenn keine Telefonnummer genannt werden soll — der Anruf-Button blendet sich dann aus."
          - name: email
            label: "E-Mail-Adresse"
            type: string
            required: true
          - name: strasse
            label: "Straße und Hausnummer"
            type: string
            required: true
          - name: plz
            label: "Postleitzahl"
            type: string
            required: true
          - name: ort
            label: "Ort"
            type: string
            required: true
      - name: farbe_primaer
        label: "Gold-Akzentfarbe (Hex-Code)"
        type: string
        description: "z. B. #C9A84C"
        required: true
      - name: google_bewertung_url
        label: "Link zu Google-Bewertungen (optional)"
        type: string
        required: false
        description: "Leer lassen, um den Bewertungs-Button auszublenden."
      - name: instagram_handle
        label: "Instagram-Handle (optional, z. B. @firmenname)"
        type: string
        required: false
      - name: instagram_url
        label: "Instagram-Link (optional)"
        type: string
        required: false
      - name: vimeo_url
        label: "Vimeo-Link (optional)"
        type: string
        required: false
      - name: youtube_url
        label: "YouTube-Link (optional)"
        type: string
        required: false
      - name: formular_endpoint
        label: "Formular-Endpoint (z. B. Formspree-URL)"
        type: string
        required: false
        description: "Leer lassen, um das Kontaktformular auszublenden — die 'Andere Wege'-Spalte auf der Kontaktseite füllt dann die volle Breite."

  # --- Navigation (_data/navigation.yml) ---
  - name: navigation
    label: "Navigation"
    type: file
    path: _data/navigation.yml
    list: true
    fields:
      - name: nav_label
        label: "Bezeichnung"
        type: string
        required: true
      - name: url
        label: "Ziel-URL"
        type: string
        required: true
      - name: nav_order
        label: "Reihenfolge"
        type: number
        required: true
      - name: visible
        label: "Sichtbar"
        type: boolean
        default: true
      - name: requires_posts
        label: "Nur anzeigen, wenn Blogbeiträge existieren"
        type: boolean
        default: false

  # --- Startseite (_data/startseite.yml) ---
  - name: startseite
    label: "Startseite — Inhalte"
    type: file
    path: _data/startseite.yml
    fields:
      - name: hero
        label: "Hero"
        type: object
        fields:
          - name: eyebrow
            label: "Kicker (klein, über der Headline)"
            type: string
            required: true
          - name: headline
            label: "Headline (HTML-Zeilenumbrüche mit <br> möglich)"
            type: string
            required: true
          - name: subline
            label: "Subline"
            type: text
            required: true
          - name: video_url
            label: "Hero-Video (optional)"
            type: string
            required: false
          - name: bild
            label: "Hero-Bild"
            type: image
            required: true
      - name: kategorien
        label: "Leistungs-Kategorien (3 Karten)"
        type: object
        list: true
        fields:
          - name: name
            label: "Name"
            type: string
            required: true
          - name: text
            label: "Kurztext"
            type: string
            required: true
          - name: url
            label: "Ziel-Link"
            type: string
            required: true
          - name: bild
            label: "Bild"
            type: image
            required: true
      - name: ueber_mich
        label: "Über mich (Kurzfassung für die Startseite)"
        type: object
        fields:
          - name: foto
            label: "Foto"
            type: image
            required: true
          - name: text
            label: "Text"
            type: text
            required: true
          - name: stats
            label: "Kennzahlen (6 Kacheln)"
            type: object
            list: true
            fields:
              - name: wert
                label: "Wert"
                type: string
                required: true
              - name: label
                label: "Beschriftung"
                type: string
                required: true
      - name: cta
        label: "CTA-Banner"
        type: object
        fields:
          - name: headline
            label: "Headline"
            type: string
            required: true
          - name: sub
            label: "Subline (kursiv)"
            type: string
            required: true

  # --- Hochzeiten (_data/hochzeiten.yml) ---
  - name: hochzeiten
    label: "Seite: Hochzeiten"
    type: file
    path: _data/hochzeiten.yml
    fields:
      - name: hero
        label: "Hero"
        type: object
        fields:
          - name: eyebrow
            label: "Kicker"
            type: string
            required: true
          - name: headline
            label: "Headline"
            type: string
            required: true
          - name: subline
            label: "Subline"
            type: text
            required: true
          - name: bild
            label: "Hero-Bild"
            type: image
            required: true
      - name: feature
        label: "Video-Block"
        type: object
        fields:
          - name: eyebrow
            label: "Kicker"
            type: string
            required: true
          - name: headline
            label: "Headline"
            type: string
            required: true
          - name: text
            label: "Text"
            type: text
            required: true
          - name: video_url
            label: "Video (YouTube/Vimeo, optional)"
            type: string
            required: false
          - name: bild
            label: "Vorschaubild"
            type: image
            required: true
      - name: werte
        label: "Werte (4 Kacheln)"
        type: object
        list: true
        fields:
          - name: titel
            label: "Titel"
            type: string
            required: true
          - name: text
            label: "Text"
            type: text
            required: true
      - name: cta
        label: "CTA-Banner"
        type: object
        fields:
          - name: headline
            label: "Headline"
            type: string
            required: true
          - name: text
            label: "Text"
            type: text
            required: true
          - name: bild
            label: "Bild"
            type: image
            required: true

  # --- Events (_data/events.yml) ---
  - name: events
