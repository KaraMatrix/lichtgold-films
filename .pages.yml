          - name: video_url
            label: "Video (YouTube/Vimeo, optional)"
            type: string
            required: false
          - name: bild
            label: "Vorschaubild"
            type: image
            required: true
      - name: kategorien
        label: "Event-Kategorien (5 Karten)"
        type: object
        list: true
        fields:
          - name: titel
            label: "Titel"
            type: string
            required: true
          - name: text
            label: "Text"
            type: text
            required: true
      - name: usps
        label: "Stärken (4 Kacheln)"
        type: object
        list: true
        fields:
          - name: titel
            label: "Titel"
            type: string
            required: true
          - name: text
            label: "Text"
            type: text
            required: true
      - name: cta
        label: "CTA-Section"
        type: object
        fields:
          - name: headline
            label: "Headline"
            type: string
            required: true
          - name: bild
            label: "Hintergrundbild"
            type: image
            required: true

  # --- Commercials (_data/commercials.yml) ---
  - name: commercials
    label: "Seite: Commercials"
    type: file
