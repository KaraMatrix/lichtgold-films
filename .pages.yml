            type: string
            required: true
          - name: text
            label: "Text"
            type: text
            required: true
      - name: prozess
        label: "Prozess-Schritte"
        type: object
        list: true
        fields:
          - name: titel
            label: "Titel"
            type: string
            required: true
          - name: text
            label: "Text"
            type: text
            required: true
      - name: cta
        label: "CTA-Section"
        type: object
        fields:
          - name: headline
            label: "Headline"
            type: string
            required: true
