            label: "Text"
            type: text
            required: true
          - name: bild
            label: "Hintergrundbild"
            type: image
            required: true

  # --- Über mich (_data/ueber-mich.yml) ---
  - name: ueber_mich_seite
    label: "Seite: Über mich"
    type: file
    path: _data/ueber-mich.yml
    fields:
      - name: hero
        label: "Hero"
        type: object
        fields:
          - name: headline
            label: "Headline"
            type: string
            required: true
          - name: text
            label: "Text"
            type: text
            required: true
          - name: bild
            label: "Hero-Bild"
            type: image
            required: true
      - name: story
        label: "Meine Geschichte"
        type: object
        fields:
          - name: headline
            label: "Headline"
            type: string
            required: true
          - name: portraet
            label: "Portrait"
            type: image
            required: true
          - name: text
            label: "Textabsätze"
            type: text
            list: true
      - name: stats
        label: "Kennzahlen (4 Kacheln)"
        type: object
        list: true
        fields:
          - name: wert
            label: "Wert"
            type: string
            required: true
          - name: label
            label: "Beschriftung"
            type: string
            required: true
      - name: ansatz
        label: "Mein Ansatz (4 Kacheln)"
        type: object
        list: true
        fields:
          - name: titel
            label: "Titel"
            type: string
            required: true
          - name: text
            label: "Text"
            type: text
            required: true
      - name: kamera_bilder
        label: "Ein Blick hinter die Kamera (Bildergalerie, optional)"
        type: image
        list: true
