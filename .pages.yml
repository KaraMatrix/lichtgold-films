  # --- Die 6 Kernseiten selbst: Titel/Beschreibung/Darstellung (warm/hell/dunkel) ---
  - name: seite_home
    label: "Seiten-Einstellungen: Start"
    type: file
    path: index.md
    fields: &seiten_einstellungen_felder
      - name: description
        label: "Meta-Beschreibung (SEO, Google-Snippet)"
        type: string
        required: true
      - name: theme
        label: "Darstellung"
        type: select
        required: true
        options:
          values:
            - name: warm
              label: "Warm (Gold-Beige — nur Startseite)"
            - name: hell
              label: "Hell (fast weiß)"
            - name: dunkel
              label: "Dunkel"

  - name: seite_hochzeiten
    label: "Seiten-Einstellungen: Hochzeiten"
    type: file
    path: hochzeiten.md
    fields: *seiten_einstellungen_felder

  - name: seite_events
    label: "Seiten-Einstellungen: Events"
    type: file
    path: events.md
    fields: *seiten_einstellungen_felder

  - name: seite_commercials
    label: "Seiten-Einstellungen: Commercials"
    type: file
    path: commercials.md
    fields: *seiten_einstellungen_felder

  - name: seite_ueber_mich
    label: "Seiten-Einstellungen: Über mich"
    type: file
    path: ueber-mich.md
    fields: *seiten_einstellungen_felder

  - name: seite_kontakt
    label: "Seiten-Einstellungen: Kontakt"
    type: file
    path: kontakt.md
    fields: *seiten_einstellungen_felder

  # --- Portfolio-Projekte (_projekte/) ---
  - name: projekte
    label: "Portfolio-Projekte"
    type: collection
    path: _projekte
    view:
      fields: [title, kategorie, published]
    fields:
      - name: title
        label: "Titel"
        type: string
        required: true
      - name: kategorie
        label: "Kategorie"
        type: select
        required: true
        options:
          values:
            - name: hochzeit
              label: "Hochzeit"
            - name: event
              label: "Event"
            - name: commercial
              label: "Commercial"
      - name: video_url
        label: "Video-URL (optional)"
        type: string
        required: false
        description: "YouTube- oder Vimeo-Link einfügen. Leer lassen, wenn (noch) kein Video vorliegt — es wird dann nur das Vorschaubild ohne Play-Symbol gezeigt."
      - name: vorschaubild
        label: "Vorschaubild"
        type: image
        required: true
        description: "Pflichtfeld — wird als Kartenbild und als Video-Vorschaubild genutzt (auch bei YouTube, aus DSGVO-Gründen kein Thumbnail von externen Servern vor dem Klick)."
      - name: beschreibung
        label: "Kurzbeschreibung"
        type: text
        required: true
      - name: reihenfolge
        label: "Reihenfolge"
        type: number
        required: true
        description: "Steuert die Sortierung innerhalb der jeweiligen Kategorie (niedrigste Zahl zuerst) sowie in 'Einige aktuelle Filme' auf der Startseite (alle Kategorien gemischt)."
      - name: published
        label: "Veröffentlicht"
        type: boolean
        default: true

  # --- Unterseiten, z. B. Impressum/Datenschutz (_pages/) ---
  - name: pages
    label: "Unterseiten"
    type: collection
    path: _pages
    view:
      fields: [title, published]
    fields:
      - name: title
        label: "Titel"
        type: string
        required: true
      - name: nav_label
        label: "Bezeichnung in der Navigation"
        type: string
        required: true
      - name: nav_order
        label: "Reihenfolge in der Navigation"
        type: number
        default: 50
      - name: nav_location
        label: "Anzeigeort"
        type: select
        options:
          values:
            - name: header
              label: "Hauptnavigation"
            - name: footer
              label: "Footer"
        default: footer
      - name: published
        label: "Veröffentlicht"
        type: boolean
        default: true
      - name: noindex
        label: "Von Google ausschließen (z. B. Impressum/Datenschutz)"
        type: boolean
        default: false
      - name: sitemap
        label: "In Sitemap aufnehmen"
        type: boolean
        default: true
      - name: body
        label: "Inhalt"
        type: rich-text

  # --- Blog (_posts/) ---
  - name: posts
    label: "Journal (Blog)"
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{fields.title}.md"
    view:
      fields: [title, date]
    fields:
      - name: title
        label: "Titel"
        type: string
        required: true
      - name: date
        label: "Datum"
        type: date
        required: true
      - name: image
        label: "Aufmacherbild"
        type: image
        required: false
      - name: body
        label: "Text"
        type: rich-text
