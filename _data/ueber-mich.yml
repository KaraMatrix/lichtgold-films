ansatz:
  - titel: Echt
    text: Ich halte echte Emotionen fest – ungestellt und authentisch.
  - titel: Unauffällig
    text: Ich bin da, ohne im Mittelpunkt zu stehen. So entstehen die ehrlichsten Momente.
  - titel: Zeitlos
    text: Meine Filme sind so gestaltet, dass sie auch in Jahren noch Gänsehaut erzeugen.
  - titel: Hochwertig
    text: Von der Planung bis zum finalen Film lege ich Wert auf höchste Qualität und Detail.

