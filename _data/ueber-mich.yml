# Editierbare Inhalte der Seite /ueber-mich/ (Theme: hell).
hero:
  headline: Videograf aus Leidenschaft.
  text: Geschichten, die berühren. Bilder, die bleiben. Ich begleite Hochzeiten, Events und Unternehmen und sorge dafür, dass echte Emotionen in zeitlosen Filmen festgehalten werden.
  bild: /assets/uploads/ueber-mich-hero.svg

story:
  headline: Wie alles begann.
  portraet: /assets/uploads/ueber-mich-story.svg
  text:
    - Schon immer haben mich Filme und Emotionen fasziniert. Mit 17 habe ich meine erste Kamera in die Hand genommen und gemerkt – das ist mehr als ein Hobby, das ist meine Leidenschaft.
    - Heute habe ich das Privileg, Menschen an den wichtigsten Tagen ihres Lebens zu begleiten und für Unternehmen starke visuelle Geschichten zu erzählen.
    - Mein Ziel ist immer dasselbe – echte Emotionen einfangen und Filme schaffen, die man immer wieder fühlen möchte.

