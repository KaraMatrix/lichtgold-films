ueber_mich:
  foto: /assets/uploads/ueber-mich-hero.jpg
  text: Als Filmemacher aus Berlin begleite ich Paare an ihrem besonderen Tag,
    dokumentiere Events, die bewegen, und übersetze Markenbotschaften in
    cineastische Bilder. Mein Antrieb – jeder Moment verdient einen Film, der in
    Erinnerung bleibt. Ob elegante Hochzeit, dynamisches Firmen-Event oder
    aufmerksamkeitsstarker Werbespot – ich bringe Leidenschaft, handwerkliches
    Können und einen ehrlichen Blick für das Wesentliche mit.
