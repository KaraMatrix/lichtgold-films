# Firmen-/Kontaktdaten) — siehe SoC-Hinweis im README.
hero:
  eyebrow: Filme voller
  headline: "Licht.<br>Gefühl.<br>Erinnerung."
  subline: Hochzeitsfilme, Eventfilme und Commercials – mit Herz, Ästhetik und einem Blick für das Wesentliche.
  video_url: ""
  bild: /assets/uploads/hero-still.svg

kategorien:
  - name: Hochzeiten
    text: Echte Momente. Für die Ewigkeit.
    url: /hochzeiten/
    bild: /assets/uploads/home-kat-hochzeiten.svg
  - name: Events
    text: Momente, die verbinden.
    url: /events/
    bild: /assets/uploads/home-kat-events.svg
  - name: Commercials
    text: Starke Bilder. Starke Marken.
    url: /commercials/
    bild: /assets/uploads/home-kat-commercials.svg

ueber_mich:
  foto: /assets/uploads/portrait-placeholder.svg
  text: Als Filmemacher aus Berlin begleite ich Paare an ihrem besonderen Tag, dokumentiere Events, die bewegen, und übersetze Markenbotschaften in cineastische Bilder. Mein Antrieb – jeder Moment verdient einen Film, der in Erinnerung bleibt. Ob elegante Hochzeit, dynamisches Firmen-Event oder aufmerksamkeitsstarker Werbespot – ich bringe Leidenschaft, handwerkliches Können und einen ehrlichen Blick für das Wesentliche mit.
  stats:
    - wert: 5+
      label: Jahre Erfahrung
    - wert: 100%
      label: Leidenschaft
    - wert: 100+
      label: Projekte
    - wert: Ehrlich
      label: "& Persönlich"
    - wert: Deutschlandweit
      label: "& International"
    - wert: Hochwertig
      label: Filme

cta:
  headline: Jeder Film beginnt mit einer Geschichte.
  sub: Vielleicht ist die nächste eure.
