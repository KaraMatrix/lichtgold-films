# Statische Formate (kein Portfolio-Bezug — im Quell-Design ohne Fotos, nur Icon+Text).
formate:
  - titel: Imagefilme
    text: Dein Unternehmen, deine Werte – meisterhaft inszeniert.
  - titel: Produktvideos
    text: Dein Produkt in seinem besten Licht – für Web und Shop.
  - titel: Werbespots
    text: 30 oder 60 Sekunden, die im Gedächtnis bleiben.
  - titel: Corporate Films
    text: Recruiting, Employer Branding, interne Kommunikation.
  - titel: Social Media Content
    text: Reels, Stories & Clips – native für jede Plattform.

prozess:
  - titel: Verstehen
    text: Wir hören zu – deine Marke, dein Ziel, deine Zielgruppe. Erst verstehen, dann planen.
  - titel: Konzeption
    text: Storyboard, Konzept, Drehbuch. Wir entwickeln eine kreative Idee, die funktioniert.
  - titel: Produktion
    text: Professioneller Dreh, Licht, Ton – alles aus einer Hand. Effizient und termingerecht.
  - titel: Wirkung
    text: Schnitt, Color Grading, Sounddesign – bis der Film eure Marke auf den Punkt bringt.

