# Editierbare Inhalte der Seite /hochzeiten/ (Theme: hell).
hero:
  eyebrow: Hochzeitsfilme & Videografie
  headline: Echte Momente. Für die Ewigkeit.
  subline: Hochzeitsfilme, Events & Commercials in Berlin und weltweit.
